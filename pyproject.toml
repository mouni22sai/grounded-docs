[project]
name = "grounded-docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chithirala Naga Mounika", email = "Chithirala.Mounika@ge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.135.0",
]

